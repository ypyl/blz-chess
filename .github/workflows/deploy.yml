name: deploy

# Publishes the site to GitHub Pages on every push to main. The branch is the
# gate: a pull request gets no Pages permissions and no OIDC token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # GitHub Pages serves a project site from a sub-path. The source keeps "/" so
  # `dotnet run` works, and the deployed shell is rewritten to this path.
  BASE_PATH: /blz-chess/

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install the SDK global.json names, so the workload version, and with it
      # the ILLink package the lock file pins, matches the dev machine.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore locked
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test -c Release --no-restore

      - name: Publish
        run: dotnet publish src/BlzChess.Web -c Release --no-restore -o dist

      - name: Serve the shell from the project sub-path
        run: sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|" dist/wwwroot/index.html

      # GitHub Pages answers an unknown path with 404.html. Serving the app shell
      # there is what lets a deep link reach the Blazor router.
      - name: Copy the shell to 404.html
        run: cp dist/wwwroot/index.html dist/wwwroot/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A green deploy proves Pages accepted the artifact, not that the site works.
  # This fetches the shell, proves the base path, and proves the boot script the
  # shell names is really there.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke the deployed site
        env:
          BASE_PATH: /blz-chess/
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE_PATH}"
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS "$url"); then break; fi
            echo "attempt $attempt: $url not answering yet"
            sleep 10
          done
          test -n "${body:-}" || { echo "::$error::$url never answered"; exit 1; }

          grep -q "base href=\"${BASE_PATH}\"" <<< "$body"

          asset=$(grep -oE '_framework/blazor\.webassembly\.[a-z0-9]+\.js' <<< "$body" | head -1)
          test -n "$asset" || { echo "::$error::the shell names no boot script"; exit 1; }
          curl -fsS -o /dev/null "$url${asset}"
          curl -fsS -o /dev/null "${url}manifest.webmanifest"

          # One byte of the engine proves the asset a game will fetch is served.
          curl -fsS -r 0-0 -o /dev/null "${url}engine/stockfish-19-lite-single.wasm"

          echo "smoke passed: $url"
