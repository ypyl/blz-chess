name: deploy

# Publishes the site to GitHub Pages on every push to main. The branch is the
# gate: a pull request gets no Pages permissions and no OIDC token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # GitHub Pages serves a project site from a sub-path. The source keeps "/" so
  # `dotnet run` works, and the deployed shell is rewritten to this path.
  BASE_PATH: /blz-chess/

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install the SDK global.json names, so the workload version, and with it
      # the ILLink package the lock file pins, matches the dev machine.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore locked
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test -c Release --no-restore

      # The site is served from a sub-path, so the shell's base href has to say so
      # before publish, not after: the service worker records the hash of every
      # file it caches, and a file edited after publish can never match it.
      - name: Point the shell at the project sub-path
        run: sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|" src/BlzChess.Web/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/BlzChess.Web -c Release --no-restore -o dist

      - name: Refuse dotfiles in the site
        run: |
          if find dist/wwwroot -name '.*' -type f | grep -q .; then
            echo "::error::Pages does not serve dotfiles, and one missing asset fails the service worker install"
            find dist/wwwroot -name '.*' -type f
            exit 1
          fi

      # The service worker refuses to install when one cached file disagrees with
      # the hash the build recorded. A shell edited after publish does exactly that.
      - name: Verify every asset matches the hash the worker will check
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const root = "dist/wwwroot";
            const text = fs.readFileSync(path.join(root, "service-worker-assets.js"), "utf8");
            const manifest = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
            let bad = 0;
            for (const asset of manifest.assets) {
              const file = path.join(root, asset.url.split("?")[0]);
              if (!fs.existsSync(file)) { console.log("missing", asset.url); bad++; continue; }
              const hash = "sha256-" + crypto.createHash("sha256").update(fs.readFileSync(file)).digest("base64");
              if (hash !== asset.hash) { console.log("hash mismatch", asset.url); bad++; }
            }
            if (bad > 0) { console.log("::error::the service worker would fail to install"); process.exit(1); }
            console.log("all " + manifest.assets.length + " assets match their recorded hash");
          '

      # GitHub Pages answers an unknown path with 404.html. Serving the app shell
      # there is what lets a deep link reach the Blazor router.
      - name: Copy the shell to 404.html
        run: cp dist/wwwroot/index.html dist/wwwroot/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A green deploy proves Pages accepted the artifact, not that the site works.
  # This fetches the shell, proves the base path, and proves the boot script the
  # shell names is really there.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke the deployed site
        env:
          BASE_PATH: /blz-chess/
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE_PATH}"
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS "$url"); then break; fi
            echo "attempt $attempt: $url not answering yet"
            sleep 10
          done
          test -n "${body:-}" || { echo "::$error::$url never answered"; exit 1; }

          grep -q "base href=\"${BASE_PATH}\"" <<< "$body"

          asset=$(grep -oE '_framework/blazor\.webassembly\.[a-z0-9]+\.js' <<< "$body" | head -1)
          test -n "$asset" || { echo "::$error::the shell names no boot script"; exit 1; }
          curl -fsS -o /dev/null "$url${asset}"
          curl -fsS -o /dev/null "${url}manifest.webmanifest"
          curl -fsS -o /dev/null "${url}icon.svg"
          curl -fsS -o /dev/null "${url}icon-192.png"
          curl -fsS -o /dev/null "${url}icon-512.png"

          # One byte of the engine proves the asset a game will fetch is served.
          curl -fsS -r 0-0 -o /dev/null "${url}engine/stockfish-19-lite-single.wasm"

          echo "smoke passed: $url"
