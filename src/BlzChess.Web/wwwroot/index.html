<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlzChess</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- The board can appear before these have ever been requested. Loading them
         with the page means the first board paints complete, with no empty squares. -->
    <link rel="preload" as="image" href="pieces/wP.svg" />
    <link rel="preload" as="image" href="pieces/wN.svg" />
    <link rel="preload" as="image" href="pieces/wB.svg" />
    <link rel="preload" as="image" href="pieces/wR.svg" />
    <link rel="preload" as="image" href="pieces/wQ.svg" />
    <link rel="preload" as="image" href="pieces/wK.svg" />
    <link rel="preload" as="image" href="pieces/bP.svg" />
    <link rel="preload" as="image" href="pieces/bN.svg" />
    <link rel="preload" as="image" href="pieces/bB.svg" />
    <link rel="preload" as="image" href="pieces/bR.svg" />
    <link rel="preload" as="image" href="pieces/bQ.svg" />
    <link rel="preload" as="image" href="pieces/bK.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <main class="shell">
            <header class="bar">
                <span class="level-select loading-placeholder" aria-hidden="true">No idea how to play</span>
                <span class="ghost loading-placeholder" aria-hidden="true">Restart</span>
            </header>
                <div class="loading-board" aria-hidden="true">
                <span class="light" data-order="25"><img src="pieces/bR.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="26"><img src="pieces/bN.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="27"><img src="pieces/bB.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="28"><img src="pieces/bQ.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="29"><img src="pieces/bK.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="30"><img src="pieces/bB.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="31"><img src="pieces/bN.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="32"><img src="pieces/bR.svg" alt="" aria-hidden="true" /></span>
                <span class="dark" data-order="17"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="18"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="19"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="20"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="21"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="22"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="23"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="24"><img src="pieces/bP.svg" alt="" aria-hidden="true" /></span>
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
                <span class="light" data-order="9"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="10"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="11"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="12"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="13"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="14"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="15"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="16"><img src="pieces/wP.svg" alt="" aria-hidden="true" /></span>
                <span class="dark" data-order="1"><img src="pieces/wR.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="2"><img src="pieces/wN.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="3"><img src="pieces/wB.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="4"><img src="pieces/wQ.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="5"><img src="pieces/wK.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="6"><img src="pieces/wB.svg" alt="" aria-hidden="true" /></span><span class="dark" data-order="7"><img src="pieces/wN.svg" alt="" aria-hidden="true" /></span><span class="light" data-order="8"><img src="pieces/wR.svg" alt="" aria-hidden="true" /></span>
            </div>
            <p class="status loading-placeholder" aria-hidden="true">Your move.</p>
        </main>
        <script>
            // The board fills one square at a time as the runtime arrives. Blazor
            // publishes its progress as a custom property on the document, and this
            // loop stops the moment Blazor replaces the loading markup.
            (function () {
                const board = document.querySelector('.loading-board');
                if (!board) {
                    return;
                }

                const cells = Array.from(board.children);
                const tick = () => {
                    if (!board.isConnected) {
                        return;
                    }

                    const raw = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage');
                    const percentage = parseFloat(raw);
                    // Thirty-two pieces are placed, so the board ends up set.
                    const placed = Number.isFinite(percentage) ? Math.round((percentage / 100) * 32) : 0;
                    for (const cell of cells) {
                        const order = Number(cell.dataset.order ?? 0);
                        cell.classList.toggle('spawned', order > 0 && order <= placed);
                    }

                    requestAnimationFrame(tick);
                };

                requestAnimationFrame(tick);
            })();
        </script>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/pointer.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // The worker activates a new build immediately and takes the open page with
        // it, so a returning visitor is never stuck on the version they first
        // loaded. The first install claims the page without a reload.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) {
                    return;
                }
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => registration.update());
        }
    </script>
</body>

</html>
