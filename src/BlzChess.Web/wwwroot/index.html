<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlzChess</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- The board can appear before these have ever been requested. Loading them
         with the page means the first board paints complete, with no empty squares. -->
    <link rel="preload" as="image" href="pieces/wP.svg" />
    <link rel="preload" as="image" href="pieces/wN.svg" />
    <link rel="preload" as="image" href="pieces/wB.svg" />
    <link rel="preload" as="image" href="pieces/wR.svg" />
    <link rel="preload" as="image" href="pieces/wQ.svg" />
    <link rel="preload" as="image" href="pieces/wK.svg" />
    <link rel="preload" as="image" href="pieces/bP.svg" />
    <link rel="preload" as="image" href="pieces/bN.svg" />
    <link rel="preload" as="image" href="pieces/bB.svg" />
    <link rel="preload" as="image" href="pieces/bR.svg" />
    <link rel="preload" as="image" href="pieces/bQ.svg" />
    <link rel="preload" as="image" href="pieces/bK.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading" role="progressbar" aria-label="Loading BlzChess">
            <div class="loading-board" aria-hidden="true">
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
                <span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span>
                <span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span><span class="dark"></span><span class="light"></span>
            </div>
            <p class="loading-text"></p>
        </div>
        <script>
            // The board fills one square at a time as the runtime arrives. Blazor
            // publishes its progress as a custom property on the document, and this
            // loop stops the moment Blazor replaces the loading markup.
            (function () {
                const board = document.querySelector('.loading-board');
                if (!board) {
                    return;
                }

                const cells = Array.from(board.children);
                const tick = () => {
                    if (!board.isConnected) {
                        return;
                    }

                    const raw = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage');
                    const percentage = parseFloat(raw);
                    const filled = Number.isFinite(percentage) ? Math.round((percentage / 100) * cells.length) : 0;
                    for (let index = 0; index < cells.length; index++) {
                        cells[index].classList.toggle('filled', index < filled);
                    }

                    requestAnimationFrame(tick);
                };

                requestAnimationFrame(tick);
            })();
        </script>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // The worker activates a new build immediately and takes the open page with
        // it, so a returning visitor is never stuck on the version they first
        // loaded. The first install claims the page without a reload.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) {
                    return;
                }
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => registration.update());
        }
    </script>
</body>

</html>
